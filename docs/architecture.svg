<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a8f5a"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fd1"/></marker>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#111">Vault program: accounts, instructions and flow</text>
  <text x="40" y="82" font-size="16" fill="#555">Anchor program on devnet. Every account below is a PDA except the user wallet.</text>

  <!-- User -->
  <rect x="40" y="130" width="240" height="110" rx="12" fill="#fff4d6" stroke="#c79a1e" stroke-width="2"/>
  <text x="160" y="170" font-size="20" font-weight="700" text-anchor="middle">User (Signer)</text>
  <text x="160" y="196" font-size="14" text-anchor="middle" fill="#444">wallet, pays rent and fees,</text>
  <text x="160" y="216" font-size="14" text-anchor="middle" fill="#444">signs every instruction</text>

  <!-- Vault program -->
  <rect x="380" y="110" width="430" height="370" rx="14" fill="#eef3ff" stroke="#3a5bd9" stroke-width="2"/>
  <text x="595" y="146" font-size="21" font-weight="700" text-anchor="middle">Vault program (pre_req_vault)</text>
  <g font-size="15">
    <rect x="405" y="166" width="380" height="64" rx="8" fill="#fff" stroke="#3a5bd9"/>
    <text x="420" y="192" font-weight="700">1. initialize</text>
    <text x="420" y="214" fill="#444">creates vault_state, stores both bumps</text>
    <rect x="405" y="240" width="380" height="64" rx="8" fill="#fff" stroke="#3a5bd9"/>
    <text x="420" y="266" font-weight="700">2. deposit(amount)</text>
    <text x="420" y="288" fill="#444">System transfer: user to vault</text>
    <rect x="405" y="314" width="380" height="84" rx="8" fill="#fff" stroke="#0a8f5a" stroke-width="2"/>
    <text x="420" y="340" font-weight="700">3. withdraw(amount)</text>
    <text x="420" y="362" fill="#444">System transfer: vault to user (PDA signs)</text>
    <text x="420" y="384" fill="#7a3fd1" font-weight="700">+ CPI: registration.initialize("Hijanhv")</text>
    <rect x="405" y="408" width="380" height="60" rx="8" fill="#fff" stroke="#3a5bd9"/>
    <text x="420" y="434" font-weight="700">4. close</text>
    <text x="420" y="455" fill="#444">sweeps vault to user, closes vault_state</text>
  </g>

  <!-- vault_state -->
  <rect x="930" y="120" width="420" height="120" rx="12" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
  <text x="950" y="152" font-size="19" font-weight="700">vault_state (VaultState)</text>
  <text x="950" y="178" font-size="14" fill="#333">seeds: ["state", user]</text>
  <text x="950" y="200" font-size="14" fill="#333">owner: vault program, data: vault_bump, state_bump</text>
  <text x="950" y="222" font-size="14" fill="#333">created by initialize, closed by close</text>

  <!-- vault -->
  <rect x="930" y="270" width="420" height="120" rx="12" fill="#e7f8ef" stroke="#0a8f5a" stroke-width="2"/>
  <text x="950" y="302" font-size="19" font-weight="700">vault (SystemAccount)</text>
  <text x="950" y="328" font-size="14" fill="#333">seeds: ["vault", vault_state]</text>
  <text x="950" y="350" font-size="14" fill="#333">holds the SOL, no data, owned by System Program</text>
  <text x="950" y="372" font-size="14" fill="#333">program signs for it with seeds + vault_bump</text>

  <!-- Registration program -->
  <rect x="380" y="560" width="430" height="150" rx="14" fill="#f4edff" stroke="#7a3fd1" stroke-width="2"/>
  <text x="595" y="596" font-size="20" font-weight="700" text-anchor="middle">Turbin3 registration program</text>
  <text x="595" y="622" font-size="14" text-anchor="middle" fill="#444">TRBZyQHB3m68FGeVsqTK39Wm4xejadjVhP5MAZaKWDM</text>
  <text x="595" y="652" font-size="15" text-anchor="middle">initialize(github: String)</text>
  <text x="595" y="676" font-size="14" text-anchor="middle" fill="#444">accounts: user (signer), account, system_program</text>

  <!-- application account -->
  <rect x="930" y="575" width="420" height="120" rx="12" fill="#f4edff" stroke="#7a3fd1" stroke-width="2"/>
  <text x="950" y="607" font-size="19" font-weight="700">application_account</text>
  <text x="950" y="633" font-size="14" fill="#333">seeds: ["prereqs", user] under registration program</text>
  <text x="950" y="655" font-size="14" fill="#333">stores the GitHub username</text>
  <text x="950" y="677" font-size="14" fill="#333">one per wallet (init fails if it exists)</text>

  <!-- System program -->
  <rect x="40" y="560" width="240" height="90" rx="12" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
  <text x="160" y="598" font-size="18" font-weight="700" text-anchor="middle">System Program</text>
  <text x="160" y="622" font-size="14" text-anchor="middle" fill="#444">moves lamports, creates accounts</text>

  <!-- arrows -->
  <line x1="280" y1="185" x2="375" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="168" font-size="13" fill="#333">signs tx</text>
  <line x1="785" y1="198" x2="925" y2="180" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="176" font-size="13" fill="#333">init</text>
  <line x1="785" y1="272" x2="925" y2="320" stroke="#0a8f5a" stroke-width="2" marker-end="url(#g)"/>
  <text x="815" y="282" font-size="13" fill="#0a8f5a">SOL in</text>
  <line x1="925" y1="345" x2="790" y2="350" stroke="#0a8f5a" stroke-width="2" marker-end="url(#g)"/>
  <text x="830" y="342" font-size="13" fill="#0a8f5a">SOL out</text>
  <path d="M785,384 L860,384 L860,520 L700,520 L700,555" fill="none" stroke="#7a3fd1" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#p)"/>
  <text x="712" y="545" font-size="14" fill="#7a3fd1" font-weight="700">CPI from withdraw</text>
  <line x1="810" y1="635" x2="925" y2="635" stroke="#7a3fd1" stroke-width="2" marker-end="url(#p)"/>
  <text x="826" y="625" font-size="13" fill="#7a3fd1">creates</text>
  <line x1="420" y1="480" x2="250" y2="557" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="510" font-size="13" fill="#555">transfer CPIs</text>

  <!-- flow strip -->
  <rect x="40" y="760" width="1310" height="110" rx="12" fill="#fafafa" stroke="#ccc"/>
  <text x="60" y="792" font-size="17" font-weight="700">Lifecycle</text>
  <text x="60" y="822" font-size="15" fill="#333">initialize (state + vault PDAs)  →  deposit (user → vault)  →  withdraw (vault → user, then CPI registers GitHub)  →  close (vault → user, state closed, rent back)</text>
  <text x="60" y="850" font-size="14" fill="#555">Signer privilege of the user passes through the CPI, so the registration program sees the user as signer and payer of the new PDA.</text>
</svg>
